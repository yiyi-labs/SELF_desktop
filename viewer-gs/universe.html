<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src https://self.local; worker-src 'self' blob:">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040b;color:#e5ecfa;font-family:'HarmonyOS Sans','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#stars,#universe,#names{position:absolute;inset:0;width:100%;height:100%}
#stars{z-index:0;pointer-events:none}#universe{z-index:1;background:transparent;display:block;touch-action:none}
#names{z-index:2;pointer-events:none;overflow:hidden}
.galaxy-name{position:absolute;padding:4px 8px;border:0;background:transparent;color:#c1ccdf;font-family:inherit;font-size:13px;font-weight:400;line-height:1.6;letter-spacing:.12em;text-align:center;opacity:0;transition:opacity .5s,color .5s;pointer-events:auto;cursor:pointer;text-shadow:0 2px 6px #02040b,0 0 18px #02040b}
.galaxy-name span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.galaxy-name small{display:none;font-size:9px;letter-spacing:.22em;color:#a7bad8;margin-top:3px}
.galaxy-name.chosen{color:#f4e8d7}.galaxy-name.chosen span{font-size:16px}.galaxy-name.chosen small{display:block}
.galaxy-name.chosen::before{content:'';position:absolute;left:calc(50% - 12px);top:-7px;width:24px;height:1px;background:linear-gradient(90deg,transparent,#e7cba3,transparent)}
.galaxy-name:focus-visible{outline:1px solid #a9c8eb;outline-offset:4px;border-radius:8px}
.depth{position:absolute;z-index:2;font-size:9px;letter-spacing:.27em;color:#8b9ab5;opacity:.5;pointer-events:none;transition:opacity .8s}
#depth-far{right:26%;top:22%}#depth-near{left:9%;top:79%}
#hint,#travel-text{position:absolute;z-index:2;left:8%;right:8%;bottom:15.7%;text-align:center;color:#98aac8;font-size:11px;letter-spacing:.18em;pointer-events:none;transition:opacity .8s}
#travel-text{opacity:0;bottom:23%;color:#d3dff1;font-size:14px;letter-spacing:.2em}
.travelling #hint,.travelling .depth,.empty .depth,.empty #hint{opacity:0}.travelling #travel-text{opacity:1}
.embedded #hint{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<canvas id="stars" aria-hidden="true"></canvas><canvas id="universe" tabindex="0" aria-label="我的星辰，左下近，右上远。滑动或用方向键寻回记忆。"></canvas>
<div id="names" aria-label="历史记忆"></div><div id="depth-far" class="depth">更远的回忆</div><div id="depth-near" class="depth">此刻，近一些</div>
<div id="hint">轻轻滑动 · 循光寻回一段记忆</div><div id="travel-text" role="status" aria-live="polite"></div>
<script src="gs-universe.js"></script></body></html>
